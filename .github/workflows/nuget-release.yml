name: NuGet release

# Tags a DnDGen NuGet library's commit and creates its GitHub release, with the package and
# coverage report that nuget-build.yml uploaded in the same run attached. A library calls it from
# its own release.yml, after its publish job has pushed the package: see templates/README.md.
#
# Publishing isn't here because nuget.org only accepts a Trusted Publishing token from a job
# defined in the package's own repository. That job uses the nuget-publish action instead.

on:
  workflow_call:
    inputs:
      version:
        description: The version to release, from nuget-build.yml's version output
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: release
    # Forks run the checks but never release.
    if: github.repository_owner == 'DnDGen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: package

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: Create the GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" package/*.nupkg coverage/coverage.cobertura.xml --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
